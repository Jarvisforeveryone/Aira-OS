<svg width="432" height="432" viewBox="0 0 432 432" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C3FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Dark Background -->
  <rect width="432" height="432" fill="#050811" rx="80" />

  <!-- Glowing Outer Ring -->
  <circle cx="216" cy="216" r="135" fill="none" stroke="#0099FF" stroke-width="18" opacity="0.5" filter="url(#glowFilter)" />
  <!-- Core Gradient Ring -->
  <circle cx="216" cy="216" r="135" fill="none" stroke="url(#blueGrad)" stroke-width="16" />
  <!-- Inner Rim Light -->
  <circle cx="216" cy="216" r="127" fill="none" stroke="#B3F0FF" stroke-width="3" opacity="0.75" />

  <!-- AIRA Text Inside Ring -->
  <g fill="#FFFFFF" transform="translate(216, 216)">
    <!-- A -->
    <path d="M -75,18 L -55,-25 L -35,18 L -45,18 L -55,-4 L -65,18 Z M -61,4 L -49,4 L -55,-11 Z" />
    <!-- I -->
    <rect x="-22" y="-25" width="11" height="43" rx="2" />
    <!-- R -->
    <path d="M 5,-25 L 30,-25 C 42,-25 48,-19 48,-11 C 48,-3 42,2 30,2 L 16,2 L 16,18 L 5,18 Z M 16,-16 L 29,-16 C 36,-16 38,-14 38,-11 C 38,-8 36,-6 29,-6 L 16,-6 Z M 26,0 L 46,18 L 33,18 L 15,2 Z" />
    <!-- A -->
    <path d="M 58,18 L 78,-25 L 98,18 L 88,18 L 78,-4 L 68,18 Z M 72,4 L 84,4 L 78,-11 Z" />
  </g>
</svg>