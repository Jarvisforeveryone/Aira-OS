<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C3FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Outer Ring -->
  <circle cx="512" cy="420" r="210" fill="none" stroke="#0099FF" stroke-width="32" opacity="0.45" filter="url(#glowFilter)" />
  <!-- Core Gradient Ring -->
  <circle cx="512" cy="420" r="210" fill="none" stroke="url(#blueGrad)" stroke-width="26" />
  <!-- Inner Rim Light -->
  <circle cx="512" cy="420" r="197" fill="none" stroke="#B3F0FF" stroke-width="4" opacity="0.7" />

  <!-- AIRA Text Below Ring -->
  <g fill="#FFFFFF" transform="translate(512, 760)">
    <!-- A -->
    <path d="M -170,40 L -130,-50 L -90,40 L -112,40 L -130,-5 L -148,40 Z M -143,10 L -117,10 L -130,-25 Z" />
    <!-- I -->
    <rect x="-50" y="-50" width="22" height="90" rx="3" />
    <!-- R -->
    <path d="M 10,-50 L 60,-50 C 85,-50 98,-38 98,-22 C 98,-6 85,5 60,5 L 34,5 L 34,40 L 10,40 Z M 34,-32 L 58,-32 C 72,-32 75,-28 75,-22 C 75,-16 72,-12 58,-12 L 34,-12 Z M 52,0 L 92,40 L 66,40 L 32,5 Z" />
    <!-- A -->
    <path d="M 120,40 L 160,-50 L 200,40 L 178,40 L 160,-5 L 142,40 Z M 147,10 L 173,10 L 160,-25 Z" />
  </g>
</svg>