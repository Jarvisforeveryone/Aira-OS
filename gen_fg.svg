<svg width="432" height="432" viewBox="0 0 432 432" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AFFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring Glow -->
  <circle cx="216" cy="216" r="140" fill="none" stroke="#00AFFF" stroke-width="22" opacity="0.6" filter="url(#glow)" />
  <!-- Ring Core -->
  <circle cx="216" cy="216" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="18" />
  <!-- Inner Highlight -->
  <circle cx="216" cy="216" r="131" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" />

  <!-- AIRA Text (Centered, Geometric, No crossbar in A) -->
  <g fill="#FFFFFF" transform="translate(216, 216)">
    <!-- A -->
    <path d="M -74,20 L -53,-26 L -32,20 L -43,20 L -53,-4 L -63,20 Z" />
    <!-- I -->
    <rect x="-21" y="-26" width="11" height="46" rx="2" />
    <!-- R -->
    <path d="M 6,-26 L 31,-26 C 43,-26 50,-19 50,-11 C 50,-3 43,2 31,2 L 17,2 L 17,20 L 6,20 Z M 17,-17 L 30,-17 C 37,-17 38,-15 38,-11 C 38,-7 37,-5 30,-5 L 17,-5 Z M 26,0 L 46,20 L 33,20 L 16,2 Z" />
    <!-- A -->
    <path d="M 58,20 L 79,-26 L 100,20 L 89,20 L 79,-4 L 69,20 Z" />
  </g>
</svg>