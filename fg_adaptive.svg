<svg width="432" height="432" viewBox="0 0 432 432" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C3FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glowing Ring -->
  <circle cx="216" cy="216" r="125" fill="none" stroke="#0099FF" stroke-width="18" opacity="0.55" filter="url(#glowFilter)" />
  <!-- Core Gradient Ring -->
  <circle cx="216" cy="216" r="125" fill="none" stroke="url(#blueGrad)" stroke-width="16" />
  <!-- Inner Rim Light -->
  <circle cx="216" cy="216" r="117" fill="none" stroke="#B3F0FF" stroke-width="2.5" opacity="0.8" />

